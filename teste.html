<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fecha e Abre a Porta</title>
</head>
<body>
    <h1>O que o JS pode fazer</h1>
    
    <p>JS pode mudar os valores dos atributos de um elemento,
        realizar cálculos, construir estruturas de repetição e 
        trabalhar com condicionais.
    </p>
    
    <p>Neste caso, o JS muda qual valor?</p>

    <button onclick="document.getElementById('minhaImagem').src='porta aberta.png'">Abrir a porta</button>

    <img id="minhaImagem" src="porta fechada.png" style="width: 200px;" alt="Porta preta fechada">

    <button onclick="document.getElementById('minhaImagem').src='porta fechada.png'">Fechar a porta</button>

</body>
</html>
